spring.application.name=floodmonitor
server.address=127.0.0.1
server.port=8080
simulation.enabled=true
simulation.interval=10000
simulation.seed-history=true
measurements.max-history=10000
measurements.stale-after=PT2M
monitor.mode=local
monitor.station-id=
monitor.sources=http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
security.admin-key=${FLOOD_ADMIN_KEY:}
security.viewer-key=${FLOOD_VIEWER_KEY:}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
server.error.include-stacktrace=never
server.error.include-message=never
